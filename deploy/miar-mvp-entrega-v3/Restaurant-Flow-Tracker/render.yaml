services:
  - type: web
    name: miar-api
    env: node
    region: oregon
    plan: free
    buildCommand: |
      pnpm install
      pnpm --filter @workspace/api-server run build
    startCommand: |
      pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: miar-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: miar-gestor
    env: node
    region: oregon
    plan: free
    buildCommand: |
      pnpm install
      pnpm --filter @workspace/gestor build
    startCommand: |
      pnpm --filter @workspace/gestor exec vite preview --config vite.config.ts --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VITE_API_URL
        value: https://miar-api.onrender.com
      - key: BASE_PATH
        value: /

databases:
  - name: miar-db
    databaseName: miar
    user: miar
    plan: free
