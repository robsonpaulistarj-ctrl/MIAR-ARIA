openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: API do MVP MIAR Pessoal
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: stories
    description: Context stories
  - name: conversations
    description: Conversations and messages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Start a private staging session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /stories:
    get:
      operationId: listStories
      tags: [stories]
      summary: List the current user's stories
      parameters:
        - $ref: "#/components/parameters/MiarUser"
      responses:
        "200":
          description: Stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Story"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createStory
      tags: [stories]
      summary: Create a story
      parameters:
        - $ref: "#/components/parameters/MiarUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStoryInput"
      responses:
        "201":
          description: Created story
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "400":
          $ref: "#/components/responses/BadRequest"
  /stories/{storyId}:
    delete:
      operationId: deleteStory
      tags: [stories]
      summary: Delete a story
      parameters:
        - $ref: "#/components/parameters/MiarUser"
        - $ref: "#/components/parameters/StoryId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /uploads:
    post:
      operationId: uploadAttachment
      tags: [uploads]
      summary: Upload an attachment
      parameters:
        - $ref: "#/components/parameters/MiarUser"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "201":
          description: Stored attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
  /uploads/{encodedKey}:
    get:
      operationId: getAttachment
      tags: [uploads]
      summary: Read an attachment owned by the current user
      parameters:
        - $ref: "#/components/parameters/MiarUser"
        - name: encodedKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attachment content
          content:
            application/octet-stream: {}
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List conversations
      parameters:
        - $ref: "#/components/parameters/MiarUser"
        - name: storyId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a conversation
      parameters:
        - $ref: "#/components/parameters/MiarUser"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationWithMessages"
  /conversations/{conversationId}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation and its messages
      parameters:
        - $ref: "#/components/parameters/MiarUser"
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationWithMessages"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations/{conversationId}/messages:
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Send a message and generate an assistant reply
      parameters:
        - $ref: "#/components/parameters/MiarUser"
        - $ref: "#/components/parameters/ConversationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Saved messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "502":
          description: AI provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    MiarUser:
      name: X-Miar-User
      in: header
      required: false
      description: Development-only user email until OAuth is connected.
      schema:
        type: string
        format: email
    StoryId:
      name: storyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Database is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, email, displayName, createdAt]
    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        token:
          type: string
          minLength: 1
      required: [email, token]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        size:
          type: integer
          minimum: 0
        key:
          type: string
        url:
          type: string
          pattern: '^/api/uploads/[A-Za-z0-9_-]+$'
      required: [name, type, size]
    Story:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        color:
          type: string
        readAllBeforeAnswer:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, name, description, color, readAllBeforeAnswer, createdAt, updatedAt]
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        storyId:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, storyId, title, createdAt, updatedAt]
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, role, content, attachments, createdAt]
    ConversationWithMessages:
      allOf:
        - $ref: "#/components/schemas/Conversation"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
          required: [messages]
    CreateStoryInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
        readAllBeforeAnswer:
          type: boolean
      required: [name]
    CreateConversationInput:
      type: object
      properties:
        storyId:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 180
      required: [storyId]
    SendMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 20000
        attachments:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/Attachment"
        useAllHistory:
          type: boolean
      required: [content]
    SendMessageResponse:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        userMessage:
          $ref: "#/components/schemas/Message"
        assistantMessage:
          $ref: "#/components/schemas/Message"
      required: [conversation, userMessage, assistantMessage]
