services:
  - type: web
    name: miar-api
    runtime: node
    rootDir: deploy/miar-mvp-entrega-v3
    branch: staging/mvp-deploy-final
    plan: free
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter ./artifacts/api-server build
    startCommand: pnpm db:migrate && pnpm check:staging && node artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PORT
        value: '10000'
      - key: NODE_ENV
        value: production
      - key: ALLOW_EPHEMERAL_DB
        value: 'false'
      - key: MIAR_PUBLIC_ACCESS
        value: 'true'
      - key: PUBLIC_USER_EMAIL
        value: public@miar.local
      - key: DATABASE_URL
        fromDatabase:
          name: miar-db
          property: connectionString
      - key: MIAR_ACCESS_TOKEN
        generateValue: true
      - key: MIAR_SECRETS_KEY
        generateValue: true
      - key: MIAR_SETTINGS_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_MODE
        value: demo
      - key: ALLOW_EPHEMERAL_STORAGE
        value: 'false'
      - key: STORAGE_PROVIDER
        value: database
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_FORCE_PATH_STYLE
        value: 'false'
      - key: WEB_ORIGIN
        value: https://miar-web.onrender.com
      - key: LOG_LEVEL
        value: info

  - type: web
    name: miar-web
    runtime: static
    rootDir: deploy/miar-mvp-entrega-v3
    branch: staging/mvp-deploy-final
    plan: free
    autoDeployTrigger: commit
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter ./artifacts/miar-pessoal build
    staticPublishPath: ./artifacts/miar-pessoal/dist/public
    envVars:
      - key: VITE_API_URL
        value: https://miar-api-texv.onrender.com/api
      - key: VITE_AUTH_REQUIRED
        value: 'false'
      - key: VITE_PUBLIC_ACCESS
        value: 'true'

databases:
  - name: miar-db
    databaseName: miar
    user: miar
    plan: free
