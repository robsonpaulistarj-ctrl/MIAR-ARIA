<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://localhost:* http://localhost:*;" />
  <title>AI Agent Monitor</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="app">
    <!-- Cabeçalho -->
    <header class="header">
      <div class="logo">🤖 AI Agent Monitor</div>
      <div class="status" id="status">
        <span class="dot"></span>
        <span id="status-text">A ligar…</span>
      </div>
    </header>

    <div class="body">
      <!-- Painel do monitor (screenshot ao vivo) -->
      <section class="monitor-panel">
        <div class="panel-title">🖥️ Monitor ao Vivo</div>
        <div class="monitor-frame">
          <img id="monitor" src="" alt="Aguardando screenshot…" />
          <div id="monitor-empty" class="empty-state">
            O monitor aparecerá aqui quando o agente iniciar uma tarefa.
          </div>
        </div>
        <div class="step-info" id="step-info"></div>
      </section>

      <!-- Painel lateral: controlo + logs -->
      <aside class="side-panel">
        <!-- Input da tarefa -->
        <div class="task-box">
          <div class="panel-title">⚡ Tarefa</div>
          <textarea id="task-input" rows="3"
                    placeholder="Ex.: Pesquisa o preço atual do Bitcoin e diz-me quanto vale em euros."></textarea>
          <div class="task-actions">
            <button id="btn-start" class="btn primary">▶ Iniciar</button>
            <button id="btn-stop" class="btn danger" disabled>⏹ Parar</button>
          </div>
        </div>

        <!-- Raciocínio da IA -->
        <div class="log-box">
          <div class="panel-title">🧠 Raciocínio da IA</div>
          <div id="thought-log" class="log-content"></div>
        </div>

        <!-- Ações -->
        <div class="log-box">
          <div class="panel-title">🛠️ Ações Executadas</div>
          <div id="action-log" class="log-content"></div>
        </div>

        <!-- Resultado -->
        <div class="log-box">
          <div class="panel-title">✅ Resultado</div>
          <div id="result-box" class="log-content result"></div>
        </div>
      </aside>
    </div>
  </div>

  <script src="src/renderer.js"></script>
</head>
</html>
